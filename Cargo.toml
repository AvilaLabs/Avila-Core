[workspace]
members = [
  "crates/avila-core-kernel",
  "crates/avila-core-compiler",
  "crates/avila-core-evidence",
  "crates/avila-core-runner",
  "crates/avila-core-cli",
  "crates/avila-core-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Avila Labs"]
publish = false

[workspace.dependencies]
avila-core-evidence = { path = "crates/avila-core-evidence" }
avila-core-compiler = { path = "crates/avila-core-compiler" }
avila-core-kernel = { path = "crates/avila-core-kernel" }
avila-core-runner = { path = "crates/avila-core-runner" }
clap = { version = "4", features = ["derive"] }
eframe = "0.36.1"
image = { version = "0.25", default-features = false, features = ["png"] }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
thiserror = "2"

# Dependencies are optimized even in the dev profile: hashing hundreds of
# megabytes of bound artifacts, canonical JSON, and the egui renderer are all
# in dependencies, and an unoptimized `cargo run` made the workbench feel
# slow. Workspace crates keep full debug information.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
