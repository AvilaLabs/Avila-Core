name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

  documents:
    name: JSON documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse JSON documents
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            jq empty "$file"
          done < <(find schemas examples fixtures -type f -name '*.json' -print0)

  verifier:
    name: Independent verifier
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run the verifier's own fixture-vector unit tests
        working-directory: verifier
        run: python3 -m unittest test_verifier -v

      - name: Verify CASE-003 (thermal spreader, no external roots needed, ADR-0015 signatures)
        working-directory: verifier
        run: |
          python3 avila_core_verify.py verify-case ../examples/cases/case-003-thermal-spreader \
            --source-root case=../examples/cases/case-003-thermal-spreader \
            --source-root thermal=../examples/capabilities/thermal \
            --trust-root ../examples/keys/trust-root.json

      - name: Verify CASE-008 (mode-selective quench, no external roots needed)
        working-directory: verifier
        run: |
          python3 avila_core_verify.py verify-case ../examples/cases/case-008-mode-selective-quench \
            --source-root case=../examples/cases/case-008-mode-selective-quench \
            --source-root magnetic-compliance=../examples/capabilities/magnetic-compliance
